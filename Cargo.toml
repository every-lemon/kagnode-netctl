[package]
name = "kagnode-netctl"
version = "5.0.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/every-lemon/kagnode-netctl"
description = "Reviewed networking, IPAM, network services and HA network readiness"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4"
hex = "0.4"
ipnet = { version = "2", features = ["serde"] }
libc = "0.2"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
